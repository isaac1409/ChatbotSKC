version: "3.9"

# ════════════════════════════════════════════════════════════
# ChatbotSKC — Entorno de DESARROLLO LOCAL
# Para producción: usar Easypanel (no este archivo).
# Uso: docker compose up -d
#      docker compose down -v   (destruye volúmenes)
# ════════════════════════════════════════════════════════════

services:

  postgres:
    image: postgres:15-alpine
    container_name: chatbotskc_postgres
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres_dev}
      POSTGRES_DB: ${PGDATABASE:-bot_citas_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chatbotskc_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_dev}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  n8n:
    image: n8nio/n8n:1.123.21
    container_name: chatbotskc_n8n
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-dev_encryption_key_32_chars_min}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${PGDATABASE:-bot_citas_dev}
      - DB_POSTGRESDB_USER=${PGUSER:-postgres}
      - DB_POSTGRESDB_PASSWORD=${PGPASSWORD:-postgres_dev}
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_PASSWORD=${REDIS_PASSWORD:-redis_dev}
      - N8N_LOG_LEVEL=info
      - GENERIC_TIMEZONE=America/Mexico_City
      - TZ=America/Mexico_City
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  n8n_data:
